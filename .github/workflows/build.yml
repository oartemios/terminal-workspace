name: Build and test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  # Do not interrupt a tag run while it is publishing a draft.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: stable
      # Runtime tests spawn workers with a 1 s request deadline. Avoid competing
      # process-heavy tests on shared runners; the application deadline stays intact.
      RUST_TEST_THREADS: '1'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check native target
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = '${{ matrix.target }}'
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Validate version and release tag
        id: version
        run: python3 scripts/version.py
      - name: Test versioning rules
        run: python3 tests/versioning.py
      - name: Test release validation and recovery
        run: python3 tests/release.py
      - name: Initialize system test tools
        run: |
          /usr/bin/git --version
          # Runtime fixtures use /usr/bin/python3 with a 5 s handshake deadline.
          # Initialize the OS Python before the first process fixture on cold VMs.
          /usr/bin/python3 -c 'import json, os, pathlib, subprocess, sys, time; print(sys.version)'
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
      - name: Test independent custom plugin
        run: cargo test --locked --manifest-path examples/custom-plugin/Cargo.toml --target-dir target/custom-plugin
      - name: Build release
        run: cargo build --locked --release --bin tw
      - name: Package archive
        run: sh scripts/package.sh '${{ matrix.target }}'
      - name: Verify archive and local installation
        run: |
          cd dist
          name='terminal-workspace-${{ steps.version.outputs.build_version }}-${{ matrix.target }}'
          shasum -a 256 -c "$name.tar.gz.sha256"
          mkdir extracted
          tar -xzf "$name.tar.gz" -C extracted
          sh "extracted/$name/install.sh" "$RUNNER_TEMP/tw-install"
          test -x "$RUNNER_TEMP/tw-install/bin/tw"
          test "$("$RUNNER_TEMP/tw-install/bin/tw" --version)" = 'tw ${{ steps.version.outputs.version }}'
      - name: Test installed release in a terminal
        env:
          TW_TEST_BINARY: ${{ runner.temp }}/tw-install/bin/tw
        run: python3 tests/tui_pty.py
      - name: Upload installable archive
        uses: actions/upload-artifact@v6.0.0
        with:
          name: terminal-workspace-${{ steps.version.outputs.build_version }}-${{ matrix.target }}
          path: |
            dist/terminal-workspace-${{ steps.version.outputs.build_version }}-${{ matrix.target }}.tar.gz
            dist/terminal-workspace-${{ steps.version.outputs.build_version }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Download archives from this run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --dir release-artifacts
      - name: Validate complete release
        run: python3 scripts/release.py --artifacts release-artifacts --check-only
      - name: Upload, verify and publish draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py --artifacts release-artifacts
